[package]
authors = ["Jeff Muizelaar <jmuizelaar@mozilla.com>"]
description = "A library to extract content from pdfs"
documentation = "https://docs.rs/crate/pdf-extract/"
edition = "2021"
keywords = ["pdf2text", "text", "pdf", "pdf2txt"]
license = "MIT"
name = "pdf-extract"
repository = "https://github.com/jrmuizel/pdf-extract"
version = "0.12.1"
include = ["src/**/*", "README.md"]

[profile.release]
debug = true

[dependencies]
cff-parser = "0.2.0"
euclid = "0.20.5"
# default-features = false: no rayon, so every load parses on the calling thread.
lopdf = { version = "=0.46.0", default-features = false }

[dev-dependencies]
ureq = "2.6.2"
test-log = "0.2.17"

[dev-dependencies.simple_logger]
version = "5"
default-features = false
features = ["colors"]
